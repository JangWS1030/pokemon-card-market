name: Collect market data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django
        run: python manage.py check
      - name: Check production database
        run: python manage.py check_database_connection --require-postgresql --require-migrations
      - name: Verify collector orchestration
        run: python manage.py update_korean_market --dry-run
